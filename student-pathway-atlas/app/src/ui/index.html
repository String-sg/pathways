<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238D6E63'/%3E%3Cstop offset='1' stop-color='%234E342E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E">
<title>Rosetta: Student Pathway Atlas · v0.14.4</title>
<meta name="description" content="Enter your exam results to see the post-secondary courses you can apply for, and how your net aggregate compares with the 2026 cut-off.">
<!--@STYLE-->
</head>
<body data-route="input">
<header class="topbar">
  <div class="brand" title="Rosetta: Student Pathway Atlas v0.14.4">
    <span class="brand-icon" aria-hidden="true">R</span>
    <!-- the colon sits inside brand-name so the flex gap adds no space before it (series-branding skill) -->
    <span class="brand-name">Rosetta<span class="brand-sep">:</span></span>
    <span class="brand-sub">Student Pathway Atlas</span>
    <span class="brand-version">v0.14.4</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <button type="button" class="btn-quiet" data-do="restart" id="restart">Start again</button>
  <!-- About, behind an "i" on every tab -->
  <button type="button" class="btn-quiet top-i" data-do="about-open" id="about-i" aria-haspopup="dialog"><span class="top-i-c" aria-hidden="true">i</span><span class="sr-only">About</span></button>
</header>

<main class="layout" id="main">
  <!-- shown only when the script does not run (an iPhone file preview); app.js removes it first thing -->
  <div class="nojs card" id="nojs"><p><strong>This page didn't start, because a phone's file preview can't run it.</strong> Open it from its web link, or on a computer in Chrome, Edge or Safari.</p></div>
  <section class="screen s-input" id="s-input" aria-label="Your results and choices"></section>
  <section class="screen s-list" id="s-list" aria-label="Courses"></section>
  <section class="screen s-pane" id="s-pane" aria-label="Course details and panels"></section>
</main>

<div class="bar" id="bar" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!--@SCRIPTS-->
</body>
</html>
